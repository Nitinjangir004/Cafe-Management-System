spring.application.name=cafe-management
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# Default DataSource (H2 with MySQL 8.0 compatibility for instant out-of-the-box local operation)
spring.datasource.url=jdbc:h2:mem:cafedb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging
logging.level.com.cafe.management=INFO
